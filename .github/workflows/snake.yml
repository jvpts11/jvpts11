name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#C4B550&color_dots=#3E4637,#5A6A4C,#7A8458,#A09A48,#C4B550

      - name: Commit
        run: |
          ls -la dist
          test -s dist/snake.svg || { echo "snake.svg não foi gerado"; exit 1; }
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          git diff --cached --quiet || git commit -m "chore: update snake"
          git pull --rebase
          git push
